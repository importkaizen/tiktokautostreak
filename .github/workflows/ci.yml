name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax and unit tests
        run: |
          python -m py_compile tiktok_streak_keeper.py
          PYTHONPATH=. python -m unittest discover -s tests -v
      - name: CLI help
        run: python tiktok_streak_keeper.py --help
